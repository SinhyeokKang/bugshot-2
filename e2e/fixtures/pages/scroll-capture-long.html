<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>long scroll capture fixture</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
      /* 뷰포트의 8배 — 타일 8장(≥500ms 간격)이라 첫 진행 뒤 탭을 바꿀 여유가 수 초 남는다 */
      #tall { height: 800vh; background: linear-gradient(#fef3c7, #bfdbfe); }
    </style>
  </head>
  <body>
    <div id="tall"><h1>top of long page</h1></div>
  </body>
</html>
