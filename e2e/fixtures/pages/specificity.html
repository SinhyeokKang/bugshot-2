<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>specificity fixture</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font: 14px/1.4 system-ui, sans-serif;
      }
      /* 값 축은 전부 `rem` vs `px`다 — 색 리터럴은 CSSOM이 rgb()로 정규화하는 데다
         computed가 곧 승자 값이라, 판정이 죽어 computed로 폴백해도 같은 값이 나와
         테스트가 아무것도 구별하지 못한다. rem은 computed에서 px로 resolve되므로
         "승자 원문"과 "computed 폴백"이 눈으로 갈린다. */
      .box {
        display: block;
        height: 56px;
        margin: 0 0 12px;
        border: 0;
        background: #dddddd;
      }

      /* 1) 높은 specificity가 문서상 **앞**에 온다 — 문서순만 보면 뒤의 `button`이 이긴다.
         브라우저 실제 승자는 `.btn`(12rem = 192px). */
      .btn {
        width: 12rem;
        /* 요소마다 다른 marker — CSS 뷰 doc이 새 요소로 갈렸는지 재는 게이트 전용이라
           단언 대상(width)과 겹치지 않게 둔다. 어느 규칙에서도 충돌하지 않는다. */
        min-height: 11px;
      }
      button {
        width: 100px;
      }

      /* 2) Chrome은 숫자로 시작하는 클래스를 hex 이스케이프로 직렬화한다(`2xl:accent`
         → `.\32 xl\:accent`). 종결 공백을 이스케이프의 일부로 안 먹으면 뒤의 `xl`이
         별개 type 셀렉터로 세져 이 규칙이 [0,1,1]로 부푼다. 실제로는 둘 다 [0,1,0]
         동률이라 문서상 뒤(`.accent-late`)가 이긴다. */
      .\32 xl\:accent {
        width: 10rem;
      }
      .accent-late {
        width: 300px;
        min-height: 12px;
      }

      /* 3) 컨테이너가 좁아 이 `@container` 규칙은 **적용되지 않는다**. 인덱서가 조건을
         평가하지 않아 규칙 자체는 인덱스에 남으므로, 승자 판정에 끼면 적용도 안 된
         50px을 확정 표시한다. opaque 처리되면 uncertain → computed로 폴백한다. */
      #cq-wrap {
        container-type: inline-size;
        width: 120px;
      }
      .cq-target {
        width: 15rem;
        min-height: 13px;
      }
      @container (min-width: 400px) {
        .cq-target {
          width: 50px;
        }
      }
    </style>
  </head>
  <body>
    <button id="btn" class="btn box">specificity</button>
    <div id="accent" class="2xl:accent accent-late box">escaped class</div>
    <div id="cq-wrap">
      <p id="cq" class="cq-target box">container query</p>
    </div>
  </body>
</html>
