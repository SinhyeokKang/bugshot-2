name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  # nightly. schedule은 GitHub 사양상 기본 브랜치(main)에서만 발화하므로 대상은 main —
  # 코드가 그대로여도 Chrome 버전·러너 이미지 변경으로 깨지는 걸 잡는 게 목적이다.
  schedule:
    - cron: "0 18 * * *" # 03:00 KST
  workflow_dispatch:

# 같은 ref로 연달아 푸시하면 이전 런은 취소 — 러너 시간 절약.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# fork PR의 임의 코드가 이 워크플로에서 돈다 — GITHUB_TOKEN은 읽기 전용으로 고정.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 유닛 ~20s + 빌드 ~10s. 넉넉히 잡되 무한 대기는 막는다.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      # pnpm 버전은 package.json의 packageManager 필드에서 가져온다(단일 출처).
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # lockfile 고정 — pnpm-workspace.yaml의 minimumReleaseAge는 신규 resolve에만
      # 걸리므로 frozen 설치에는 영향이 없다.
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Codex 미러(AGENTS.md·.agents/skills/)는 CLAUDE.md·.claude/commands/에서 생성된다.
      # 로컬 훅은 Claude Code 전용이라 Codex 세션에선 안 돌고, /push 게이트도 로컬 한정 —
      # 드리프트를 잡는 유일한 공용 그물이 여기다.
      - name: Codex mirror drift
        run: pnpm sync:agents:check

      - name: Unit + DOM tests
        run: pnpm test

      # pre-arm의 **구조적** 전제를 빌드 산출물로 검증한다 — recorders-entry가 async
      # loader로 강등되면 로드 초반 로그가 조용히 사라지는데 typecheck도 유닛도 못 잡는다.
      # 행동 검증(e2e/logs-prearm.spec.ts)은 아래 e2e job이 맡고, 이건 몇 초 만에 끝나는
      # 1차 그물이다(e2e green을 기다리지 않고 형태 회귀를 먼저 알린다).
      - name: Build
        run: pnpm build

      - name: Pre-arm chunk shape
        run: node scripts/check-prearm-chunk.mjs dist

  e2e:
    runs-on: ubuntu-latest
    # 샤드당 테스트 ~3분 + 셋업 ~2분. 걸리면 hard kill이라 후속 artifact 업로드가
    # 안 돌 수 있으니 넉넉히 잡는다.
    timeout-minutes: 30
    strategy:
      # 한 샤드가 깨져도 나머지를 끝까지 돌려 실패 전모를 한 번에 본다.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # OAuth client ID가 비면 isConfigured()가 false가 되어 연동 탭 OAuth 버튼이 사라진다.
      # .env.ci는 그 판정만 통과시키는 더미다(실 크레덴셜 아님). Vite의 loadEnv는
      # .env/.env.local/.env.[mode]만 읽어 .env.ci를 자동으로 집지 않으므로 복사한다.
      - name: Load CI env
        run: cp .env.ci .env.local

      # Playwright 버전이 바뀌면 브라우저 빌드도 바뀌므로 캐시 키에 넣는다.
      # lockfile이 아니라 실제 설치된 패키지에서 읽어 resolve 결과와 어긋나지 않게 한다.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # 캐시 미스에서만 돈다. 캐시 히트면 `--with-deps`의 apt까지 통째로 건너뛰는데,
      # 러너 이미지가 Chrome·Firefox를 이미 품고 있어 공유 라이브러리가 깔려 있기
      # 때문이다. 그 전제가 깨지면 브라우저 기동 실패로 전 spec이 즉시 죽어 조용히
      # 넘어가지 않는다.
      #
      # apt는 보통 20~45초지만 **가끔 10분으로 튄다**(실측: 한 샤드가 10분 31초, 같은
      # 런의 나머지 셋은 1분 미만). timeout이 그 편차를 잘라 job의 30분을 다 태우지
      # 않게 한다 — 캐시는 그 창을 아예 안 만나게 하는 쪽이다.
      #
      # 캐시는 같은 런 안에서도 공유된다: 먼저 끝난 샤드가 저장하면 늦게 시작한 샤드가
      # 그걸 히트한다(실측). 4샤드가 동시에 출발하면 전부 미스라 중복 설치하지만,
      # 시차가 생기면 뒤 샤드가 무임승차한다.
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        timeout-minutes: 6
        run: pnpm exec playwright install --with-deps chromium

      - run: pnpm build:e2e

      # 확장 SW가 headless에선 안 깨어나 headed 강제 — xvfb 가상 디스플레이로 우회한다.
      # 깊이 24는 필수: xvfb-run 기본이 8비트인 배포판이 있고, 캡처 spec이 스티칭 결과의
      # 픽셀 색을 직접 판정한다(fixtures/pages/scroll-capture.html의 자홍 sticky).
      #
      # `--`를 붙이지 않는다. pnpm이 리터럴로 넘기면 playwright가 그 뒤를 전부 positional
      # 파일 필터로 읽어 --shard가 플래그로 인식되지 않고 "No tests found"로 죽는다
      # (README의 `pnpm test:e2e -- <이름>`은 positional이라 그 형태가 맞다).
      - name: e2e (shard ${{ matrix.shard }}/4)
        run: xvfb-run -a --server-args="-screen 0 1920x1080x24" pnpm test:e2e --shard=${{ matrix.shard }}/4

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard${{ matrix.shard }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # 샤드 개수와 무관한 단일 이름으로 결과를 수렴시킨다 — 브랜치 프로텍션의 required
  # status check는 이 job을 가리키므로 매트릭스를 늘려도 설정을 다시 건드릴 필요가 없다.
  e2e-gate:
    needs: [e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate shard results
        run: |
          echo "e2e shards: ${{ needs.e2e.result }}"
          [ "${{ needs.e2e.result }}" = "success" ] || exit 1

  # nightly 배치 결과를 Slack으로 흘린다. 성공/실패를 **항상** 보내는 게 요점 —
  # 실패만 보내면 워크플로가 조용히 비활성화됐을 때(60일 무활동 시 GitHub가 schedule을
  # 끈다)와 green을 구분할 수 없다. 매일 1건이 부재 감지 신호를 겸한다.
  #
  # schedule 외에 workflow_dispatch도 허용하는 건 03:00을 기다리지 않고 알림 경로를
  # 검증하기 위한 것이다. dev push·main PR은 제외 — 채널이 시끄러워지고 PR 결과는
  # GitHub UI에 이미 보인다. fork PR은 이 조건에 걸릴 수 없으므로 webhook secret이
  # 노출되는 경로가 없다.
  #
  # needs는 e2e-gate가 아니라 e2e를 본다: gate는 이름을 고정하는 껍데기라 결론이 같고,
  # 여기서 한 단계 줄이면 gate 실패 원인과 알림이 어긋나지 않는다.
  notify:
    needs: [verify, e2e]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # secrets 컨텍스트는 job 레벨 if에서 못 쓴다 — env로 올려 step if에서 판정한다.
    env:
      WEBHOOK: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Compose result
        id: r
        run: |
          if [ "${{ needs.verify.result }}" = "success" ] && [ "${{ needs.e2e.result }}" = "success" ]; then
            echo "emoji=✅" >> "$GITHUB_OUTPUT"
            echo "headline=nightly CI passed" >> "$GITHUB_OUTPUT"
          else
            echo "emoji=🔴" >> "$GITHUB_OUTPUT"
            echo "headline=nightly CI failed" >> "$GITHUB_OUTPUT"
          fi
          echo "sha=$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Warn on missing webhook
        if: env.WEBHOOK == ''
        run: echo "::warning::SLACK_WEBHOOK_URL secret이 없어 알림을 건너뜁니다."

      # 커밋 메시지는 payload에 넣지 않는다 — 임의 문자열이 JSON에 그대로 박히면
      # 따옴표 하나로 payload가 깨진다. sha·ref_name만 쓰면 그 위험이 없다.
      - name: Notify Slack
        if: env.WEBHOOK != ''
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "${{ steps.r.outputs.emoji }} BugShot ${{ steps.r.outputs.headline }}",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*${{ steps.r.outputs.emoji }} BugShot ${{ steps.r.outputs.headline }}*\n<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|run #${{ github.run_number }}> · `${{ github.ref_name }}` · <https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ steps.r.outputs.sha }}>"
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    { "type": "mrkdwn", "text": "*verify*\n${{ needs.verify.result }}" },
                    { "type": "mrkdwn", "text": "*e2e (4 shards)*\n${{ needs.e2e.result }}" }
                  ]
                }
              ]
            }
